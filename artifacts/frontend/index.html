    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      /* Pre-paint theme init; mirrors src/lib/theme.ts. Key "obtv-theme"; no value => dark. */
      (function () {
        var p = "dark";
        try { var v = localStorage.getItem("obtv-theme"); if (v === "light" || v === "dark" || v === "system") p = v; else if (v !== null) localStorage.removeItem("obtv-theme"); } catch (e) {}
        var dark = p === "system" ? !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) : p === "dark";
        var r = document.documentElement;
        r.classList.remove("light", "dark");
        r.classList.add(dark ? "dark" : "light");
        r.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
