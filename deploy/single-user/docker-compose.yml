name: obtv-single

x-python-env: &python-env
  DATABASE_URL: "postgresql+asyncpg://obtv:${OBTV_SINGLE_POSTGRES_PASSWORD:?Set OBTV_SINGLE_POSTGRES_PASSWORD}@postgres:5432/obtv"
  DATABASE_URL_SYNC: "postgresql://obtv:${OBTV_SINGLE_POSTGRES_PASSWORD:?Set OBTV_SINGLE_POSTGRES_PASSWORD}@postgres:5432/obtv"
  REDIS_URL: "redis://redis:6379/0"
  QDRANT_URL: "http://qdrant:6333"
  MEDIA_ROOT: "/media"
  ARTIFACTS_ROOT: "/artifacts"
  PROXIES_DIR: "/artifacts/proxies"
  THUMBNAILS_DIR: "/artifacts/thumbnails"
  AUDIO_DIR: "/artifacts/audio"
  REELS_DIR: "/artifacts/reels"
  RENDERS_DIR: "/artifacts/renders"
  VOICES_DIR: "/artifacts/voices"
  GRAPHICS_DIR: "/artifacts/graphics"
  COMFY_WORKFLOWS_DIR: "/workflows"
  ADMIN_USERNAME: "${OBTV_SINGLE_ADMIN_USERNAME:?Set OBTV_SINGLE_ADMIN_USERNAME}"
  ADMIN_PASSWORD: "${OBTV_SINGLE_ADMIN_PASSWORD:?Set OBTV_SINGLE_ADMIN_PASSWORD}"
  INTERNAL_API_TOKEN: "${OBTV_SINGLE_INTERNAL_API_TOKEN:?Set OBTV_SINGLE_INTERNAL_API_TOKEN}"
  HF_TOKEN: "${OBTV_SINGLE_HF_TOKEN:-}"
  WHISPER_MODEL: "${OBTV_SINGLE_WHISPER_MODEL:-large-v3}"
  DIARIZATION_MODEL: "${OBTV_SINGLE_DIARIZATION_MODEL:-pyannote/speaker-diarization-community-1}"
  EMBEDDINGS_MODEL: "${OBTV_SINGLE_EMBEDDINGS_MODEL:-BAAI/bge-m3}"
  VISION_MODEL: "${OBTV_SINGLE_VISION_MODEL:-google/siglip2-so400m-patch14-384}"
  LLM_MODEL: "${OBTV_SINGLE_LLM_MODEL:-Qwen/Qwen3-4B}"
  TRANSLATE_MODEL: "${OBTV_SINGLE_TRANSLATE_MODEL:-google/madlad400-3b-mt}"
  FLORENCE_CAPTION_MODEL: "${FLORENCE_CAPTION_MODEL:-microsoft/Florence-2-large}"
  FLORENCE_CAPTION_BATCH_SIZE: "${OBTV_SINGLE_FLORENCE_CAPTION_BATCH_SIZE:-1}"
  FLORENCE_CAPTION_MAX_TOKENS: "${FLORENCE_CAPTION_MAX_TOKENS:-64}"
  FLORENCE_CAPTION_TASK: "${FLORENCE_CAPTION_TASK:-<DETAILED_CAPTION>}"
  PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"
  GPU_IDLE_RELEASE_SECONDS: "${OBTV_SINGLE_GPU_IDLE_RELEASE_SECONDS:-180}"
  EMBED_IDLE_RELEASE_SECONDS: "${OBTV_SINGLE_EMBED_IDLE_RELEASE_SECONDS:-300}"
  CURATOR_PROXY_ROOT: "/curator"
  CURATOR_INDEX_TTL: "${CURATOR_INDEX_TTL:-900}"
  CURATOR_SOURCE_ROOT: "${CURATOR_SOURCE_ROOT:-}"
  CURATOR_SOURCE_EXT: "${CURATOR_SOURCE_EXT:-.mxf}"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  artifacts_data:
  models_cache:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: obtv
      POSTGRES_PASSWORD: "${OBTV_SINGLE_POSTGRES_PASSWORD:?Set OBTV_SINGLE_POSTGRES_PASSWORD}"
      POSTGRES_DB: obtv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obtv"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../../services/api
    restart: unless-stopped
    environment:
      <<: *python-env
      # Keep bge-m3 and SigLIP on CPU so the L4 is reserved for worker jobs.
      CUDA_VISIBLE_DEVICES: ""
      CURATOR_API_BASE_URL: "${OBTV_SINGLE_CURATOR_API_BASE_URL:-https://curator.tbn.tv/CuratorGateway}"
      CURATOR_CLIENT_ID: "${OBTV_SINGLE_CURATOR_CLIENT_ID:?Set OBTV_SINGLE_CURATOR_CLIENT_ID}"
      CURATOR_CLIENT_SECRET: "${OBTV_SINGLE_CURATOR_CLIENT_SECRET:?Set OBTV_SINGLE_CURATOR_CLIENT_SECRET}"
      CURATOR_OAUTH_SCOPE: "${OBTV_SINGLE_CURATOR_OAUTH_SCOPE:-}"
      CURATOR_MEDIA_ID_QUERY_FIELD: "${OBTV_SINGLE_CURATOR_MEDIA_ID_QUERY_FIELD:?Set the canonical Curator Media ID field}"
      CURATOR_WEB_PROXY_FIELDS: "${OBTV_SINGLE_CURATOR_WEB_PROXY_FIELDS:-}"
      CURATOR_HIRES_FIELDS: "${OBTV_SINGLE_CURATOR_HIRES_FIELDS:-}"
      CURATOR_HIRES_UNC_PREFIX: "${OBTV_SINGLE_CURATOR_HIRES_UNC_PREFIX:-}"
      CURATOR_HIRES_MOUNT_ROOT: "/media"
      CURATOR_PROXY_MOUNT_ROOT: "/curator"
      OBTV_API_URL: "http://127.0.0.1:8000/api"
    volumes:
      - "${OBTV_SINGLE_CURATOR_HIRES_PATH:?Set OBTV_SINGLE_CURATOR_HIRES_PATH}:/media:ro"
      - "${OBTV_SINGLE_CURATOR_PROXY_PATH:?Set OBTV_SINGLE_CURATOR_PROXY_PATH}:/curator:ro"
      - "${OBTV_SINGLE_IMPORTS_PATH:?Set OBTV_SINGLE_IMPORTS_PATH}:/imports:ro"
      - "${OBTV_SINGLE_UPLOAD_PATH:?Set OBTV_SINGLE_UPLOAD_PATH}:/uploads"
      - artifacts_data:/artifacts
      - models_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker-gpu:
    build:
      context: ../../services/worker
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    environment:
      <<: *python-env
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - "${OBTV_SINGLE_CURATOR_HIRES_PATH:?Set OBTV_SINGLE_CURATOR_HIRES_PATH}:/media:ro"
      - "${OBTV_SINGLE_CURATOR_PROXY_PATH:?Set OBTV_SINGLE_CURATOR_PROXY_PATH}:/curator:ro"
      - "${OBTV_SINGLE_UPLOAD_PATH:?Set OBTV_SINGLE_UPLOAD_PATH}:/uploads:ro"
      - artifacts_data:/artifacts
      - models_cache:/root/.cache
    command: celery -A app worker --queues=gpu --concurrency=1 --loglevel=info --hostname=single-l4@%h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-cpu:
    build:
      context: ../../services/worker
    restart: unless-stopped
    environment:
      <<: *python-env
      # This worker must not load indexing or embedding models on the L4.
      # WebProxy imports normally avoid proxy re-encoding; HiRes fallback uses
      # the worker's CPU encoder to preserve GPU exclusivity.
      CUDA_VISIBLE_DEVICES: ""
    volumes:
      - "${OBTV_SINGLE_CURATOR_HIRES_PATH:?Set OBTV_SINGLE_CURATOR_HIRES_PATH}:/media:ro"
      - "${OBTV_SINGLE_CURATOR_PROXY_PATH:?Set OBTV_SINGLE_CURATOR_PROXY_PATH}:/curator:ro"
      - "${OBTV_SINGLE_UPLOAD_PATH:?Set OBTV_SINGLE_UPLOAD_PATH}:/uploads"
      - artifacts_data:/artifacts
      - models_cache:/root/.cache
    command: celery -A app worker -B --queues=cpu,ingest --concurrency=2 --loglevel=info --hostname=single-cpu@%h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: artifacts/frontend/Dockerfile.production
    restart: unless-stopped
    ports:
      - "${OBTV_SINGLE_HTTP_PORT:-5500}:80"
    depends_on:
      api:
        condition: service_healthy