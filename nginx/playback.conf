# Opt-in replacement for nginx.conf. Requires nginx >=1.27.3 for upstream
# resolve; frontend's nginx:alpine image supports this on a current build.
worker_processes auto;
worker_rlimit_nofile 65536;
events {
    worker_connections 8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10G;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream playback_pool {
        zone playback_pool 64k;
        least_conn;
        # Docker DNS returns the addresses of the configurable playback replicas.
        server playback:8000 resolve max_fails=2 fail_timeout=5s;
        keepalive 128;
    }

    server {
        listen 80;
        server_name _;

        # Exact endpoints ONLY. No stream/download/thumb/dub/media/search routes.
        location ~ "^/api/media/[^/]+/(?:playback|hls\.m3u8|segments/[0-9]+\.ts)$" {
            proxy_pass http://playback_pool;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Connection        "";
            proxy_read_timeout 60s;
            proxy_send_timeout 30s;
            # Do not retry a slow encode on a second replica and double work.
            proxy_next_upstream off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_cache off;
        }

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass         $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location /assets/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}